[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ordin"
version = "0.2.0.dev0"
description = "Local command intelligence and pre-execution safety for humans and AI agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "LatentOps" }]
keywords = ["cli", "linux", "shell", "safety", "agents", "policy", "command-line"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Shells",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/LatentOps/ordin"
Repository = "https://github.com/LatentOps/ordin"
Issues = "https://github.com/LatentOps/ordin/issues"

[project.optional-dependencies]
semantic = ["sentence-transformers>=3.0,<6"]
dev = [
    "build>=1.2,<2",
    "mypy>=1.17,<2",
    "pre-commit>=3.7,<5",
    "pytest>=8,<10",
    "ruff>=0.12,<1",
    "twine>=6,<7",
]

[project.scripts]
ordin = "ordin.entrypoint:main"
ordin-claude-hook = "ordin.claude_code:main"
ordin-mcp-proxy = "ordin.mcp_proxy:main"

[tool.setuptools]
packages = ["ordin", "ordin.analyzers"]

[tool.setuptools.package-data]
ordin = ["resources/*.json", "resources/**/*.json"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_configs = true
