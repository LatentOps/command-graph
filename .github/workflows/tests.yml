name: tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install development tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements/dev-baseline.txt
          python -m pip install --no-build-isolation --no-deps .
      - name: Validate pre-commit configuration
        run: pre-commit validate-config
      - name: Run shared local quality gate
        run: pre-commit run --all-files --show-diff-on-failure

  safety-benchmark:
    name: Safety benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install Ordin
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
      - name: Run deterministic safety benchmark
        run: python scripts/run_safety_benchmark.py --json-out safety-benchmark-report.json
      - name: Replay real-agent trajectory corpus
        run: python scripts/run_trajectory_corpus.py --json-out agent-trajectory-report.json
      - name: Replay promoted integration regressions
        run: python scripts/replay_regression.py --json-out regression-replay-report.json
      - name: Replay sanitized captured integration regressions
        run: python scripts/run_integration_conformance.py --json-out capture-conformance-report.json
      - name: Run real-agent integration evaluation
        run: >-
          python scripts/run_integration_evaluation.py
          --revision "${GITHUB_SHA}"
          --json-out integration-evaluation-report.json
          --markdown-out integration-evaluation-report.md
      - name: Run executable runtime integration evaluation
        run: >-
          python scripts/run_runtime_evaluation.py
          --revision "${GITHUB_SHA}"
          --repetitions 5
          --json-out runtime-integration-evaluation-report.json
          --markdown-out runtime-integration-evaluation-report.md
      - name: Upload safety benchmark reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ordin-safety-benchmark
          path: |
            safety-benchmark-report.json
            agent-trajectory-report.json
            regression-replay-report.json
            capture-conformance-report.json
            integration-evaluation-report.json
            integration-evaluation-report.md
            runtime-integration-evaluation-report.json
            runtime-integration-evaluation-report.md
          if-no-files-found: error

  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest "setuptools>=68"
          python -m pip install .
      - name: Run tests
        run: pytest -q
      - name: Validate bundled data and graph
        run: python -m ordin doctor

  macos:
    name: macOS 15 Python 3.13
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Build and install the package
        run: |
          python -m pip install --upgrade pip
          python -m pip install build pytest "setuptools>=68"
          python -m build
          python -m pip install dist/*.whl
      - name: Verify native macOS and system shells
        run: |
          python -c 'import sys; from ordin.availability import detect_environment; assert sys.platform == "darwin"; assert detect_environment().os == "darwin"'
          /bin/bash --version
          /bin/zsh --version
      - name: Test core, adapters, persistence, and system shells
        run: pytest -q
      - name: Validate installed resources
        run: |
          cd "$RUNNER_TEMP"
          ordin doctor
          ordin-codex-hook doctor
          ordin-mcp-proxy --help
          ordin-mcp-http --help
      - name: Replay integration and captured conformance
        run: python scripts/run_integration_conformance.py

  package:
    name: Build and install package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install packaging tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/release.txt
      - name: Build distributions
        run: python -m build
      - name: Validate distribution metadata
        run: python -m twine check dist/*
      - name: Install wheel in clean environment
        run: |
          python -m venv /tmp/ordin-wheel
          /tmp/ordin-wheel/bin/python -m pip install --upgrade pip
          /tmp/ordin-wheel/bin/python -m pip install dist/*.whl
          /tmp/ordin-wheel/bin/ordin --help > /tmp/ordin-help.txt
          /tmp/ordin-wheel/bin/ordin doctor
          /tmp/ordin-wheel/bin/ordin make file runnable --limit 1 --json > /tmp/ordin-search.json
          printf '%s\n' '{"session_id":"package-smoke","cwd":"/tmp","permission_mode":"default","hook_event_name":"PreToolUse","tool_name":"Read","tool_input":{"file_path":"/tmp/example"},"tool_use_id":"toolu_package"}' | /tmp/ordin-wheel/bin/ordin-claude-hook pre > /tmp/ordin-claude-hook.json
          /tmp/ordin-wheel/bin/ordin-mcp-proxy --help > /tmp/ordin-mcp-proxy-help.txt
          /tmp/ordin-wheel/bin/python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("/tmp/ordin-claude-hook.json").read_text())
          output = payload["hookSpecificOutput"]
          assert output["hookEventName"] == "PreToolUse"
          assert output["permissionDecision"] == "allow"
          PY
      - name: Upload distribution artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ordin-dist
          path: dist/*
          if-no-files-found: error

  linux-compat:
    name: Linux ${{ matrix.name }}
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debian 12
            image: debian:12-slim
            setup: >-
              apt-get update &&
              DEBIAN_FRONTEND=noninteractive apt-get install -y
              git python3 python3-pip python3-venv
          - name: Fedora 42
            image: fedora:42
            setup: dnf install -y git python3 python3-pip
    steps:
      - name: Install distro prerequisites
        run: ${{ matrix.setup }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Ordin in isolated environment
        run: |
          python3 -m venv /tmp/ordin-distro
          /tmp/ordin-distro/bin/python -m pip install --upgrade pip
          /tmp/ordin-distro/bin/python -m pip install .
      - name: Verify local distro detection
        run: |
          /tmp/ordin-distro/bin/python - <<'PY'
          from ordin.availability import detect_environment

          environment = detect_environment()
          assert environment.os == "linux"
          assert environment.distro_id
          print(environment)
          PY
      - name: Smoke-test installed CLI
        run: |
          /tmp/ordin-distro/bin/ordin doctor
          /tmp/ordin-distro/bin/ordin make file runnable --limit 1 --json
