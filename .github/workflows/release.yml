name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install release tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements/dev-baseline.txt
      - name: Validate release version
        env:
          RELEASE_REF: ${{ github.ref_name }}
          RELEASE_EVENT: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          from ordin import __version__ as runtime_version

          pyproject = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          project_version = pyproject["project"]["version"]
          if project_version != runtime_version:
              raise SystemExit(
                  f"version mismatch: pyproject={project_version}, runtime={runtime_version}"
              )

          if os.environ["RELEASE_EVENT"] == "push":
              if re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", project_version) is None:
                  raise SystemExit("published tags require a final X.Y.Z package version")
              expected_tag = f"v{project_version}"
              if os.environ["RELEASE_REF"] != expected_tag:
                  raise SystemExit(
                      f"release tag {os.environ['RELEASE_REF']!r} must equal {expected_tag!r}"
                  )

          print(f"validated release version {project_version}")
          PY
      - name: Build wheel and source distribution
        run: python -m build --no-isolation
      - name: Validate distribution metadata
        run: python -m twine check dist/*
      - name: Smoke-test built wheel
        run: |
          python -m venv /tmp/ordin-release
          /tmp/ordin-release/bin/python -m pip install --upgrade pip
          /tmp/ordin-release/bin/python -m pip install dist/*.whl
          /tmp/ordin-release/bin/ordin doctor
          /tmp/ordin-release/bin/ordin make file runnable --limit 1 --json
          /tmp/ordin-release/bin/python -I -c "from importlib.metadata import version; from ordin import Ordin, __version__; assert __version__ == version('ordin'); assert Ordin().review('git status --short').allowed"
          /tmp/ordin-release/bin/python -I -c "from ordin.integration_conformance import run_integration_conformance; report = run_integration_conformance(); assert report.failed == 0, report.errors()"
          printf '%s\n' '{"session_id":"release-smoke","cwd":"/tmp","permission_mode":"default","hook_event_name":"PreToolUse","tool_name":"Read","tool_input":{"file_path":"/tmp/example"},"tool_use_id":"release-read"}' | /tmp/ordin-release/bin/ordin-claude-hook pre > /tmp/ordin-release-hook.json
          /tmp/ordin-release/bin/python -I -c "import json; from pathlib import Path; result = json.loads(Path('/tmp/ordin-release-hook.json').read_text()); assert result['hookSpecificOutput']['permissionDecision'] == 'allow'"
          /tmp/ordin-release/bin/ordin-mcp-proxy --help > /tmp/ordin-release-proxy-help.txt
      - name: Run exact candidate acceptance against the installed wheel
        env:
          CANDIDATE_REVISION: ${{ github.sha }}
        run: python scripts/run_release_candidate.py --revision "$CANDIDATE_REVISION" --wheel-python /tmp/ordin-release/bin/python --output "$RUNNER_TEMP/ordin-candidate"
      - name: Upload candidate evaluation and environment records
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ordin-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/ordin-candidate/*
          if-no-files-found: warn
      - name: Bind distributions to source and record checksums/SBOM
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          publish_args=()
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            publish_args+=(--publish)
          fi
          python scripts/release_integrity.py create --revision "$RELEASE_SHA" --tag "$RELEASE_TAG" "${publish_args[@]}"
      - name: Upload validated artifacts
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ordin-release-dist-${{ github.sha }}
          path: dist/*
          if-no-files-found: error

  attest:
    name: Attest tested release artifacts
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: dist
          merge-multiple: true
      - name: Attest tested distributions and integrity metadata
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
      - name: Retain the verification bundle
        env:
          BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
        run: cp -- "$BUNDLE_PATH" dist/provenance.sigstore.json
      - name: Verify the generated provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh attestation verify dist/SHA256SUMS --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" --source-digest "$GITHUB_SHA" --bundle dist/provenance.sigstore.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: upload
        with:
          name: ordin-attested-dist-${{ github.sha }}
          path: dist/*
          if-no-files-found: error

  publish-github:
    name: Publish GitHub Release
    needs: attest
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      checks: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Download the exact attested artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.attest.outputs.artifact-id }}
          path: dist
          merge-multiple: true
      - name: Recheck artifact and remote tag identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release_integrity.py verify --revision "$GITHUB_SHA" --tag "$GITHUB_REF_NAME" --publish
          gh attestation verify dist/SHA256SUMS --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" --source-digest "$GITHUB_SHA"
      - name: Create immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists; refusing to replace published assets" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --target "$GITHUB_SHA" \
            --title "Ordin $GITHUB_REF_NAME" \
            --generate-notes
