name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build release artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install release tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
      - name: Validate release version
        env:
          RELEASE_REF: ${{ github.ref_name }}
          RELEASE_EVENT: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          from ordin import __version__ as runtime_version

          pyproject = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          project_version = pyproject["project"]["version"]
          if project_version != runtime_version:
              raise SystemExit(
                  f"version mismatch: pyproject={project_version}, runtime={runtime_version}"
              )

          if os.environ["RELEASE_EVENT"] == "push":
              if re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", project_version) is None:
                  raise SystemExit("published tags require a final X.Y.Z package version")
              expected_tag = f"v{project_version}"
              if os.environ["RELEASE_REF"] != expected_tag:
                  raise SystemExit(
                      f"release tag {os.environ['RELEASE_REF']!r} must equal {expected_tag!r}"
                  )

          print(f"validated release version {project_version}")
          PY
      - name: Build wheel and source distribution
        run: python -m build
      - name: Validate distribution metadata
        run: python -m twine check dist/*
      - name: Smoke-test built wheel
        run: |
          python -m venv /tmp/ordin-release
          /tmp/ordin-release/bin/python -m pip install --upgrade pip
          /tmp/ordin-release/bin/python -m pip install dist/*.whl
          /tmp/ordin-release/bin/ordin doctor
          /tmp/ordin-release/bin/ordin make file runnable --limit 1 --json
          /tmp/ordin-release/bin/python -I -c "from importlib.metadata import version; from ordin import Ordin, __version__; assert __version__ == version('ordin'); assert Ordin().review('git status --short').allowed"
          /tmp/ordin-release/bin/python -I -c "from ordin.integration_conformance import run_integration_conformance; report = run_integration_conformance(); assert report.failed == 0, report.errors()"
          printf '%s\n' '{"session_id":"release-smoke","cwd":"/tmp","permission_mode":"default","hook_event_name":"PreToolUse","tool_name":"Read","tool_input":{"file_path":"/tmp/example"},"tool_use_id":"release-read"}' | /tmp/ordin-release/bin/ordin-claude-hook pre > /tmp/ordin-release-hook.json
          /tmp/ordin-release/bin/python -I -c "import json; from pathlib import Path; result = json.loads(Path('/tmp/ordin-release-hook.json').read_text()); assert result['hookSpecificOutput']['permissionDecision'] == 'allow'"
          /tmp/ordin-release/bin/ordin-mcp-proxy --help > /tmp/ordin-release-proxy-help.txt
      - name: Upload validated artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ordin-release-dist
          path: dist/*
          if-no-files-found: error

  publish-github:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download validated release artifacts
        uses: actions/download-artifact@v4
        with:
          name: ordin-release-dist
          path: dist
      - name: Create immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists; refusing to replace published assets" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Ordin $GITHUB_REF_NAME" \
            --generate-notes
