minimum_pre_commit_version: "3.7.0"
fail_fast: false

repos:
  - repo: local
    hooks:
      - id: ruff-lint
        name: Ruff lint
        entry: python -m ruff check ordin tests scripts examples
        language: system
        pass_filenames: false
        always_run: true

      - id: ruff-format
        name: Ruff format check
        entry: python -m ruff format --check ordin tests scripts examples
        language: system
        pass_filenames: false
        always_run: true

      - id: mypy-boundaries
        name: Mypy typed boundaries
        entry: >-
          python -m mypy
          ordin/safety_benchmark.py
          ordin/trajectory_corpus.py
          ordin/regression_replay.py
          ordin/regression_promotion.py
          ordin/integration_conformance.py
          ordin/integration_evaluation.py
          ordin/runtime_evaluation.py
          ordin/diagnostics.py
          ordin/adapters.py
          ordin/agent.py
          ordin/action.py
          ordin/action_policy.py
          ordin/api.py
          ordin/audit.py
          ordin/claude_code.py
          ordin/codex.py
          ordin/execution.py
          ordin/mcp_proxy.py
          ordin/mcp_inspection.py
          ordin/mcp_setup_cli.py
          ordin/mcp_contracts.py
          ordin/contracts_cli.py
          ordin/session.py
          ordin/session_evaluation.py
          ordin/provenance.py
          ordin/semantics.py
          ordin/temporal.py
          ordin/tool_calls.py
          ordin/policy.py
          ordin/entrypoint.py
          ordin/context.py
          ordin/trace.py
          ordin/enforcement.py
          ordin/availability.py
        language: system
        pass_filenames: false
        always_run: true

      - id: compile
        name: Compile Python sources
        entry: python -m compileall -q ordin scripts examples
        language: system
        pass_filenames: false
        always_run: true

      - id: ordin-doctor
        name: Validate Ordin data and graph
        entry: python -m ordin doctor
        language: system
        pass_filenames: false
        always_run: true

      - id: ordin-namespace
        name: Enforce Ordin namespace
        entry: python scripts/check_namespace.py
        language: system
        pass_filenames: false
        always_run: true
